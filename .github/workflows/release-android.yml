# Rilis Android otomatis.
#
# Cara pakai: naikkan versi di app/build.gradle.kts (versionCode +1, versionName),
# commit, `git push origin main`. Workflow ini:
#   - versi belum berubah  -> jalan, cek registry, lewati (hijau, tidak ada rilis)
#   - versionCode naik      -> build APK bertanda tangan -> GitHub Release -> publish
#                              ke /api/mobile/android/releases -> HP lihat banner update
#
# workflow_dispatch dipakai untuk rilis khusus (forceUpdate / minimumSupportedVersion /
# catatan rilis manual). Versi tetap dibaca dari build.gradle.kts.
name: release-android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "Catatan rilis, pisahkan dengan | (kosong = pakai pesan commit)"
        required: false
      minSupported:
        description: "minimumSupportedVersion (opsional, default 1)"
        required: false
      forceUpdate:
        description: "Wajibkan update?"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write # buat GitHub Release + upload asset APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baca versi + catatan
        id: v
        run: |
          set -euo pipefail
          NAME="$(grep -oE 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          CODE="$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')"
          NOTES="${{ inputs.notes }}"
          [ -n "$NOTES" ] || NOTES="$(git log -1 --pretty=%s)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Pulihkan keystore dari secret
        run: printf '%s' "${{ secrets.SC_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build + validasi + publish (atau lewati kalau versi belum naik)
        env:
          SC_KEYSTORE: ${{ runner.temp }}/release.jks
          SC_KEYSTORE_PASS: ${{ secrets.SC_KEYSTORE_PASS }}
          SC_KEY_ALIAS: ${{ secrets.SC_KEY_ALIAS }}
          SC_KEY_PASS: ${{ secrets.SC_KEY_PASS }}
          MOBILE_RELEASE_PUBLISH_TOKEN: ${{ secrets.MOBILE_RELEASE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VNAME: ${{ steps.v.outputs.name }}
          VCODE: ${{ steps.v.outputs.code }}
          VNOTES: ${{ steps.v.outputs.notes }}
          VMIN: ${{ inputs.minSupported }}
          VFORCE: ${{ inputs.forceUpdate }}
        run: |
          set -euo pipefail
          args=("$VNAME" "$VCODE" --no-bump --allow-dirty --publish)
          IFS='|' read -ra N <<< "${VNOTES:-}"
          for n in "${N[@]}"; do [ -n "$n" ] && args+=(--note "$n"); done
          [ -n "${VMIN:-}" ] && args+=(--min "$VMIN")
          [ "${VFORCE:-false}" = "true" ] && args+=(--force)
          chmod +x tools/release.sh gradlew
          tools/release.sh "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/apk/release/school-community-*.apk') != ''
        with:
          name: apk-${{ steps.v.outputs.name }}
          path: app/build/outputs/apk/release/school-community-*.apk
